# MongoDB (base « hopital2 ») + API H2 de la Clinique Al Bacar.
#
# Choix de securite appliques ici :
#   - MongoDB demarre AVEC authentification (MONGO_INITDB_ROOT_*). Sans elle,
#     toute personne joignant le port lit et modifie les dossiers patients.
#   - Le port de MongoDB n'est publie que sur 127.0.0.1 : la base est joignable
#     depuis le poste, jamais depuis le reseau local.
#   - L'API tourne sous un utilisateur sans privilege (voir Dockerfile).
#   - L'API est servie en HTTPS, avec les certificats montes en lecture seule.
#   - Aucun secret n'est ecrit dans ce fichier : tout vient du .env local.
#
# Mise en route :
#   1) cp .env.example .env   puis renseigner MONGO_UTILISATEUR,
#      MONGO_MOT_DE_PASSE et SEC_SEL_AUDIT (depuis env.h2)
#   2) py ../securite/outils/generer_jetons.py
#   3) py ../securite/outils/generer_certificats.py --ip <adresse du poste>
#   4) docker compose up -d mongo
#   5) depuis hopital2/ : python charger_mongo.py hopital2_mongodb_v3.js
#      Le chargeur lit MONGO_UTILISATEUR et MONGO_MOT_DE_PASSE dans .env.
#      Sur une base déjà remplie, il faut --remplacer (efface les collections).
#   6) docker compose up -d api        puis https://127.0.0.1:8002/docs
#   7) imagerie : docker compose up -d orthanc, puis depuis hopital2/ :
#      python charger_dicom.py   (images de demonstration, voir docs/imagerie.md)
#
# PACS Orthanc : authentification obligatoire, port publie sur 127.0.0.1
# seulement, serveur DICOM classique (DIMSE, port 4242) desactive. L'autre
# hopital n'y accede jamais directement : il passe par la passerelle
# /dicom-web de l'API (jeton, portee h2:imagerie.lire, consentement).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Lie a la boucle locale : accessible depuis le poste, pas depuis le reseau.
    ports: ["127.0.0.1:27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_UTILISATEUR:?definir MONGO_UTILISATEUR dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_MOT_DE_PASSE:?definir MONGO_MOT_DE_PASSE dans .env}
    volumes: ["mongo_data:/data/db"]

  orthanc:
    # Image officielle avec le plugin DICOMweb. Version a verifier au premier
    # lancement (docker compose pull orthanc) : elle n'a pas ete testee ici.
    image: orthancteam/orthanc:24.12.1
    restart: unless-stopped
    ports: ["127.0.0.1:8042:8042"]
    environment:
      ORTHANC__NAME: "PACS Clinique Al Bacar"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${H2_ORTHANC_UTILISATEUR:?definir H2_ORTHANC_UTILISATEUR dans .env}": "${H2_ORTHANC_MOT_DE_PASSE:?definir H2_ORTHANC_MOT_DE_PASSE dans .env}"}'
      ORTHANC__DICOM_SERVER_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"   # joignable par l'API dans le reseau Docker
      DICOM_WEB_PLUGIN_ENABLED: "true"
    volumes: ["orthanc_data:/var/lib/orthanc/db"]

  api:
    # Le contexte est la racine du depot : l'image embarque aussi securite/.
    build:
      context: ..
      dockerfile: hopital2/Dockerfile
    restart: unless-stopped
    ports: ["8002:8002"]
    environment:
      MONGO_UTILISATEUR: ${MONGO_UTILISATEUR:?definir MONGO_UTILISATEUR dans .env}
      MONGO_MOT_DE_PASSE: ${MONGO_MOT_DE_PASSE:?definir MONGO_MOT_DE_PASSE dans .env}
      MONGO_HOTE: mongo
      MONGO_DB: ${MONGO_DB:-hopital2}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-https://127.0.0.1:8002/fhir}
      H1_IPP_SYSTEM: ${H1_IPP_SYSTEM:-https://chu-almassira.ma/ipp}
      # --- securite ---
      SEC_MODE: ${SEC_MODE:-strict}
      SEC_TLS_REQUIS: ${SEC_TLS_REQUIS:-1}
      SEC_REGISTRE: /app/securite/registre_jetons.json
      SEC_CA: /app/securite/certificats/ac_interop.cert.pem
      SEC_JOURNAL: /app/journaux/securite-h2.jsonl
      SEC_SEL_AUDIT: ${SEC_SEL_AUDIT:?definir SEC_SEL_AUDIT dans .env (securite/jetons_locaux/env.h2)}
      SEC_JWT_SECRET: ${SEC_JWT_SECRET:-}
      # Connexion du personnel : secret propre a H2 et comptes (dossier en ecriture :
      # le changement de mot de passe reecrit le fichier).
      SEC_SESSION_SECRET: ${SEC_SESSION_SECRET:-}
      SEC_UTILISATEURS: /app/securite/comptes/utilisateurs-h2.json
      SEC_TAILLE_MAX_CORPS: ${SEC_TAILLE_MAX_CORPS:-5000000}
      SEC_DEBIT_PAR_MINUTE: ${SEC_DEBIT_PAR_MINUTE:-120}
      # Jeton partage historique : laisser vide des que le registre est en place.
      H2_TOKEN: ${H2_TOKEN:-}
      # --- imagerie ---
      H2_ORTHANC_URL: http://orthanc:8042/dicom-web
      H2_ORTHANC_UTILISATEUR: ${H2_ORTHANC_UTILISATEUR:-}
      H2_ORTHANC_MOT_DE_PASSE: ${H2_ORTHANC_MOT_DE_PASSE:-}
      H2_DICOMWEB_URL: ${H2_DICOMWEB_URL:-https://127.0.0.1:8002/dicom-web}
    volumes:
      # Monter seulement les fichiers necessaires a H2. Le dossier entier
      # contiendrait aussi les cles privees de l'autorite et de H1.
      - type: bind
        source: ../securite/registre_jetons.json
        target: /app/securite/registre_jetons.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../securite/comptes
        target: /app/securite/comptes
        bind: {create_host_path: true}
      - type: bind
        source: ../securite/certificats/ac_interop.cert.pem
        target: /app/securite/certificats/ac_interop.cert.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../securite/certificats/h2.cert.pem
        target: /app/securite/certificats/h2.cert.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../securite/certificats/h2.key.pem
        target: /app/securite/certificats/h2.key.pem
        read_only: true
        bind: {create_host_path: false}
      - journaux:/app/journaux
    command: >
      uvicorn api_h2:app --host 0.0.0.0 --port 8002
      --ssl-keyfile /app/securite/certificats/h2.key.pem
      --ssl-certfile /app/securite/certificats/h2.cert.pem
    # Sans TLS (poste de test isole UNIQUEMENT) : commenter le bloc command
    # ci-dessus et lancer avec SEC_MODE=local SEC_TLS_REQUIS=0 dans le .env.
    depends_on: [mongo, orthanc]

volumes:
  mongo_data:
  orthanc_data:
  journaux:
